global:
  slack_api_url: '${SLACK_URL}'
  telegram_api_url: '${TELEGRAM_URL}'

route:
  receiver: 'slack'
  routes:
    - receiver: 'slack'
      continue: true
    - receiver: 'telegram'
      continue: true

receivers:
  - name: 'slack'
    slack_configs:
      - send_resolved: true
        channel: '${SLACK_CHANNEL}'
        http_config:
          authorization:
            credentials: '${SLACK_TOKEN}'
        title: '{{ template "slack-title-tmpl" . }}'
        text: '{{ template "slack-text-tmpl" . }}'

  - name: 'telegram'
    telegram_configs:
      - send_resolved: true
        bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: '{{ template "telegram-message-tmpl" . }}'
        parse_mode: '${TELEGRAM_PARSE_MODE}'
        disable_notifications: ${TELEGRAM_DISABLE_NOTIFICATIONS}

templates:
  - './slack-title.tmpl'
  - './slack-text.tmpl'
  - './telegram-message.tmpl'
